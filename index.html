<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Chat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      max-width: min(1100px, 96vw);
      margin: 0 auto;
      padding: 1rem;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #fafafa;
    }
    .msg { margin: 0.5rem 0; }
    .msg.user { text-align: right; }
    .msg .bubble {
      padding: 0.5rem 0.75rem;
      border-radius: 12px;
      text-align: left;
    }
    .msg.user .bubble {
      display: inline-block;
      max-width: 90%;
      background: #2563eb;
      color: white;
    }
    .msg.bot .bubble {
      display: block;
      max-width: 100%;
      background: #e5e7eb;
      color: #111827;
    }
    .msg .markdown {
      word-break: break-word;
      line-height: 1.5;
    }
    .msg .markdown.streaming {
      white-space: pre-wrap;
    }
    .msg .markdown > :first-child { margin-top: 0; }
    .msg .markdown > :last-child { margin-bottom: 0; }
    .msg .markdown p { margin: 0.5em 0; }
    .msg .markdown ul,
    .msg .markdown ol { margin: 0.5em 0; padding-left: 1.5em; }
    .msg .markdown h1 { font-size: 1.35em; margin: 0.75em 0 0.35em; }
    .msg .markdown h2 { font-size: 1.2em; margin: 0.75em 0 0.35em; }
    .msg .markdown h3 { font-size: 1.05em; margin: 0.75em 0 0.35em; }
    .msg .markdown code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9em;
      background: rgba(0, 0, 0, 0.08);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    .msg.user .markdown code { background: rgba(255, 255, 255, 0.2); }
    .msg .markdown blockquote {
      margin: 0.5em 0;
      padding-left: 1em;
      border-left: 3px solid #9ca3af;
      color: #4b5563;
    }
    .msg.user .markdown blockquote {
      border-color: rgba(255, 255, 255, 0.5);
      color: rgba(255, 255, 255, 0.92);
    }
    .msg .markdown a { color: #1d4ed8; }
    .msg.user .markdown a { color: #bfdbfe; }
    .msg .markdown table {
      border-collapse: collapse;
      margin: 0.5em 0;
      font-size: 0.9em;
    }
    .msg .markdown th,
    .msg .markdown td {
      border: 1px solid #d1d5db;
      padding: 0.35em 0.6em;
    }
    .msg .markdown hr { border: none; border-top: 1px solid #d1d5db; margin: 0.75em 0; }
    .msg .markdown + .markdown,
    .msg .markdown + .code-lang,
    .msg .markdown + .code-wrap,
    .msg .code-lang + .code-wrap,
    .msg .code-wrap + .markdown,
    .msg .code-wrap + .code-wrap {
      margin-top: 0.5rem;
    }
    .code-wrap {
      position: relative;
    }
    .msg pre.code-block,
    .code-wrap pre {
      margin: 0;
      padding: 0.75rem 2.25rem 0.75rem 1rem;
      border-radius: 6px;
      overflow-x: auto;
      background: #1e293b !important;
      color: #f1f5f9;
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .msg.user pre.code-block,
    .msg.user .code-wrap pre {
      background: rgba(0, 0, 0, 0.25) !important;
      color: #f8fafc;
    }
    .msg pre.code-block code,
    .code-wrap pre code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre;
      display: block;
      background: transparent !important;
      color: inherit;
      text-shadow: none;
    }
    .msg .code-lang {
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.75;
      margin-bottom: 0.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .copy-code-btn {
      position: absolute;
      top: 0.35rem;
      right: 0.35rem;
      z-index: 1;
      padding: 0.3rem;
      border: none;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      cursor: pointer;
      line-height: 0;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }
    .code-wrap:hover .copy-code-btn,
    .copy-code-btn:focus-visible {
      opacity: 0.65;
    }
    .copy-code-btn:hover {
      opacity: 1 !important;
      background: rgba(255, 255, 255, 0.16);
    }
    .copy-code-btn.copied {
      opacity: 1;
      color: #86efac;
    }
    .copy-code-btn svg {
      width: 14px;
      height: 14px;
      display: block;
    }
    form { display: flex; gap: 0.5rem; }
    input[type="text"] {
      flex: 1;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      padding: 0.6rem 1rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: white;
      color: #374151;
      border: 1px solid #ccc;
      flex-shrink: 0;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }
    .toolbar label { color: #374151; white-space: nowrap; }
    .toolbar select {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.9rem;
      background: white;
    }
    .error { color: #b91c1c; font-size: 0.9rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>LLM Chat</h1>
  <div class="toolbar">
    <label for="provider">Provider</label>
    <select id="provider" disabled>
      <option>Loading…</option>
    </select>
    <label for="model">Model</label>
    <select id="model" disabled>
      <option>Loading…</option>
    </select>
    <button type="button" id="clear" class="secondary">Clear chat</button>
  </div>
  <div id="messages"></div>
  <form id="form">
    <input type="text" id="input" placeholder="Type a message…" autocomplete="off" required>
    <button type="submit" id="send">Send</button>
  </form>
  <p class="error" id="error" hidden></p>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup.min.js"></script>
  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const errorEl = document.getElementById("error");
    const providerSelect = document.getElementById("provider");
    const modelSelect = document.getElementById("model");
    const clearBtn = document.getElementById("clear");
    const PROVIDER_STORAGE_KEY = "chat-provider";
    const modelStorageKey = (provider) => `chat-model-${provider}`;
    const SYSTEM_MESSAGE = { role: "system", content: "You are a helpful assistant." };

    const history = [SYSTEM_MESSAGE];

    async function loadProviders() {
      const res = await fetch("/api/providers");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not load providers");
      if (!data.providers.length) {
        throw new Error(
          "No API keys configured. Set HYPERBOLIC_API_KEY and/or OPENROUTER_API_KEY."
        );
      }

      const savedProvider = localStorage.getItem(PROVIDER_STORAGE_KEY);
      providerSelect.replaceChildren();
      for (const p of data.providers) {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.label;
        providerSelect.appendChild(opt);
      }
      const initialProvider =
        data.providers.find((p) => p.id === savedProvider)?.id || data.default;
      providerSelect.value = initialProvider;
      providerSelect.disabled = false;
      return initialProvider;
    }

    async function loadModels(provider) {
      modelSelect.disabled = true;
      modelSelect.replaceChildren();
      const loading = document.createElement("option");
      loading.textContent = "Loading…";
      modelSelect.appendChild(loading);

      const res = await fetch(`/api/models?provider=${encodeURIComponent(provider)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not load models");

      const savedModel = localStorage.getItem(modelStorageKey(provider));
      modelSelect.replaceChildren();
      for (const m of data.models) {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = m.label;
        modelSelect.appendChild(opt);
      }
      const initialModel =
        data.models.find((m) => m.id === savedModel)?.id || data.default;
      modelSelect.value = initialModel;
      modelSelect.disabled = false;
    }

    providerSelect.addEventListener("change", () => {
      localStorage.setItem(PROVIDER_STORAGE_KEY, providerSelect.value);
      loadModels(providerSelect.value).catch((err) => showError(err.message));
    });

    modelSelect.addEventListener("change", () => {
      localStorage.setItem(modelStorageKey(providerSelect.value), modelSelect.value);
    });

    loadProviders()
      .then((provider) => loadModels(provider))
      .catch((err) => showError(err.message));

    const PRISM_LANGS = {
      python: "python",
      py: "python",
      javascript: "javascript",
      js: "javascript",
      node: "javascript",
      nodejs: "javascript",
      html: "html",
      htm: "html",
    };

    function prismLanguage(lang) {
      return PRISM_LANGS[lang.toLowerCase()] || null;
    }

    const COPY_ICON = (
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" '
      + 'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" '
      + 'aria-hidden="true">'
      + '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>'
      + '<path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>'
      + '</svg>'
    );

    function copyButtonForPre(pre) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "copy-code-btn";
      btn.title = "Copy code";
      btn.innerHTML = COPY_ICON;
      btn.addEventListener("click", async () => {
        const codeEl = pre.querySelector("code") || pre;
        try {
          await navigator.clipboard.writeText(codeEl.textContent);
          btn.classList.add("copied");
          btn.title = "Copied!";
          setTimeout(() => {
            btn.classList.remove("copied");
            btn.title = "Copy code";
          }, 1500);
        } catch {
          btn.title = "Copy failed";
        }
      });
      return btn;
    }

    function wrapPreWithCopy(pre) {
      if (pre.parentElement?.classList.contains("code-wrap")) return;
      const wrap = document.createElement("div");
      wrap.className = "code-wrap";
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(copyButtonForPre(pre));
      wrap.appendChild(pre);
    }

    function attachCopyButtons(container) {
      container.querySelectorAll("pre").forEach(wrapPreWithCopy);
    }

    marked.setOptions({ breaks: true, gfm: true });

    function renderMarkdown(text) {
      const html = marked.parse(text);
      return DOMPurify.sanitize(html);
    }

    function parseMessage(text) {
      const parts = [];
      const re = /```([a-zA-Z0-9_+#.-]*)\r?\n([\s\S]*?)```/g;
      let lastIndex = 0;
      let match;
      while ((match = re.exec(text)) !== null) {
        if (match.index > lastIndex) {
          parts.push({ type: "text", content: text.slice(lastIndex, match.index) });
        }
        parts.push({
          type: "code",
          lang: match[1].trim(),
          content: match[2].replace(/\n$/, ""),
        });
        lastIndex = match.index + match[0].length;
      }
      if (lastIndex < text.length) {
        parts.push({ type: "text", content: text.slice(lastIndex) });
      }
      if (parts.length === 0) {
        parts.push({ type: "text", content: text });
      }
      return parts;
    }

    function fillBubble(bubble, text) {
      for (const part of parseMessage(text)) {
        if (part.type === "text") {
          if (part.content.length === 0) continue;
          const block = document.createElement("div");
          block.className = "markdown";
          block.innerHTML = renderMarkdown(part.content);
          block.querySelectorAll("a[href]").forEach((a) => {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          });
          bubble.appendChild(block);
        } else {
          if (part.lang) {
            const label = document.createElement("div");
            label.className = "code-lang";
            label.textContent = part.lang;
            bubble.appendChild(label);
          }
          const pre = document.createElement("pre");
          pre.className = "code-block";
          const code = document.createElement("code");
          code.textContent = part.content;
          const prismLang = prismLanguage(part.lang);
          if (prismLang) {
            code.className = "language-" + prismLang;
          }
          pre.appendChild(code);
          bubble.appendChild(pre);
        }
      }
      attachCopyButtons(bubble);
    }

    function highlightCode(bubble) {
      if (!window.Prism) return;
      bubble.querySelectorAll(
        "code.language-python, code.language-javascript, code.language-html"
      ).forEach(
        (block) => Prism.highlightElement(block)
      );
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addBubble(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : "bot");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      fillBubble(bubble, text);
      highlightCode(bubble);
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      scrollToBottom();
    }

    function createStreamingBotBubble() {
      const div = document.createElement("div");
      div.className = "msg bot";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      const streamEl = document.createElement("div");
      streamEl.className = "markdown streaming";
      bubble.appendChild(streamEl);
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      scrollToBottom();
      return { div, bubble, streamEl };
    }

    function finalizeBubble(bubble, text) {
      bubble.replaceChildren();
      fillBubble(bubble, text);
      highlightCode(bubble);
      scrollToBottom();
    }

    async function readChatStream(res, onUpdate) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let full = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let newlineAt;
        while ((newlineAt = buffer.indexOf("\n")) !== -1) {
          const line = buffer.slice(0, newlineAt).trim();
          buffer = buffer.slice(newlineAt + 1);
          if (!line.startsWith("data: ")) continue;
          const payload = line.slice(6);
          if (payload === "[DONE]") continue;
          const data = JSON.parse(payload);
          if (data.error) {
            throw new Error(
              typeof data.error === "string" ? data.error : JSON.stringify(data.error)
            );
          }
          if (data.content) {
            full += data.content;
            onUpdate(full);
          }
        }
      }
      return full;
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = !msg;
    }

    function clearChat() {
      history.splice(1);
      messagesEl.replaceChildren();
      showError("");
      input.focus();
    }

    clearBtn.addEventListener("click", clearChat);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      sendBtn.disabled = true;
      clearBtn.disabled = true;
      showError("");

      history.push({ role: "user", content: text });
      addBubble("user", text);

      const { div: botRow, bubble, streamEl } = createStreamingBotBubble();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: history,
            model: modelSelect.value,
            provider: providerSelect.value,
          }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          const detail = data.detail
            ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail))
            : data.detail;
          throw new Error(
            [data.error, detail].filter(Boolean).join(" — ") || "Request failed"
          );
        }

        const reply = await readChatStream(res, (text) => {
          streamEl.textContent = text;
          scrollToBottom();
        });

        history.push({ role: "assistant", content: reply });
        finalizeBubble(bubble, reply);
      } catch (err) {
        botRow.remove();
        showError(err.message);
        history.pop();
      } finally {
        sendBtn.disabled = false;
        clearBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
