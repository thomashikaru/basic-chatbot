<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperbolic Chat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      max-width: min(1100px, 96vw);
      margin: 0 auto;
      padding: 1rem;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #fafafa;
    }
    .msg { margin: 0.5rem 0; }
    .msg.user { text-align: right; }
    .msg .bubble {
      padding: 0.5rem 0.75rem;
      border-radius: 12px;
      text-align: left;
    }
    .msg.user .bubble {
      display: inline-block;
      max-width: 90%;
      background: #2563eb;
      color: white;
    }
    .msg.bot .bubble {
      display: block;
      max-width: 100%;
      background: #e5e7eb;
      color: #111827;
    }
    .msg .markdown {
      word-break: break-word;
      line-height: 1.5;
    }
    .msg .markdown > :first-child { margin-top: 0; }
    .msg .markdown > :last-child { margin-bottom: 0; }
    .msg .markdown p { margin: 0.5em 0; }
    .msg .markdown ul,
    .msg .markdown ol { margin: 0.5em 0; padding-left: 1.5em; }
    .msg .markdown h1 { font-size: 1.35em; margin: 0.75em 0 0.35em; }
    .msg .markdown h2 { font-size: 1.2em; margin: 0.75em 0 0.35em; }
    .msg .markdown h3 { font-size: 1.05em; margin: 0.75em 0 0.35em; }
    .msg .markdown code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9em;
      background: rgba(0, 0, 0, 0.08);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    .msg.user .markdown code { background: rgba(255, 255, 255, 0.2); }
    .msg .markdown pre:not(.code-block) {
      overflow-x: auto;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      background: #1e293b;
      color: #f1f5f9;
    }
    .msg.user .markdown pre:not(.code-block) {
      background: rgba(0, 0, 0, 0.25);
    }
    .msg .markdown blockquote {
      margin: 0.5em 0;
      padding-left: 1em;
      border-left: 3px solid #9ca3af;
      color: #4b5563;
    }
    .msg.user .markdown blockquote {
      border-color: rgba(255, 255, 255, 0.5);
      color: rgba(255, 255, 255, 0.92);
    }
    .msg .markdown a { color: #1d4ed8; }
    .msg.user .markdown a { color: #bfdbfe; }
    .msg .markdown table {
      border-collapse: collapse;
      margin: 0.5em 0;
      font-size: 0.9em;
    }
    .msg .markdown th,
    .msg .markdown td {
      border: 1px solid #d1d5db;
      padding: 0.35em 0.6em;
    }
    .msg .markdown hr { border: none; border-top: 1px solid #d1d5db; margin: 0.75em 0; }
    .msg .markdown + .markdown,
    .msg .markdown + .code-lang,
    .msg pre.code-block + .markdown {
      margin-top: 0.5rem;
    }
    .msg pre.code-block {
      margin: 0;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      overflow-x: auto;
      background: #1e293b !important;
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .msg.user pre.code-block {
      background: rgba(0, 0, 0, 0.25) !important;
    }
    .msg pre.code-block code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre;
      display: block;
      background: transparent !important;
      text-shadow: none;
    }
    .msg .code-lang {
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.75;
      margin-bottom: 0.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    form { display: flex; gap: 0.5rem; }
    input[type="text"] {
      flex: 1;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      padding: 0.6rem 1rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: white;
      color: #374151;
      border: 1px solid #ccc;
      flex-shrink: 0;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }
    .toolbar label { color: #374151; white-space: nowrap; }
    .toolbar select {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.9rem;
      background: white;
    }
    .error { color: #b91c1c; font-size: 0.9rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>Hyperbolic Chat</h1>
  <div class="toolbar">
    <label for="model">Model</label>
    <select id="model" disabled>
      <option>Loading…</option>
    </select>
    <button type="button" id="clear" class="secondary">Clear chat</button>
  </div>
  <div id="messages"></div>
  <form id="form">
    <input type="text" id="input" placeholder="Type a message…" autocomplete="off" required>
    <button type="submit" id="send">Send</button>
  </form>
  <p class="error" id="error" hidden></p>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const errorEl = document.getElementById("error");
    const modelSelect = document.getElementById("model");
    const clearBtn = document.getElementById("clear");
    const MODEL_STORAGE_KEY = "hyperbolic-chat-model";
    const SYSTEM_MESSAGE = { role: "system", content: "You are a helpful assistant." };

    const history = [SYSTEM_MESSAGE];

    async function loadModels() {
      const res = await fetch("/api/models");
      const data = await res.json();
      if (!res.ok) throw new Error("Could not load models");

      const saved = localStorage.getItem(MODEL_STORAGE_KEY);
      modelSelect.replaceChildren();
      for (const m of data.models) {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = m.label;
        modelSelect.appendChild(opt);
      }
      const initial =
        data.models.find((m) => m.id === saved)?.id || data.default;
      modelSelect.value = initial;
      modelSelect.disabled = false;
    }

    modelSelect.addEventListener("change", () => {
      localStorage.setItem(MODEL_STORAGE_KEY, modelSelect.value);
    });

    loadModels().catch((err) => showError(err.message));

    const PRISM_LANGS = {
      python: "python",
      py: "python",
      javascript: "javascript",
      js: "javascript",
      node: "javascript",
      nodejs: "javascript",
    };

    function prismLanguage(lang) {
      return PRISM_LANGS[lang.toLowerCase()] || null;
    }

    marked.setOptions({ breaks: true, gfm: true });

    function renderMarkdown(text) {
      const html = marked.parse(text);
      return DOMPurify.sanitize(html);
    }

    function parseMessage(text) {
      const parts = [];
      const re = /```([a-zA-Z0-9_+#.-]*)\r?\n([\s\S]*?)```/g;
      let lastIndex = 0;
      let match;
      while ((match = re.exec(text)) !== null) {
        if (match.index > lastIndex) {
          parts.push({ type: "text", content: text.slice(lastIndex, match.index) });
        }
        parts.push({
          type: "code",
          lang: match[1].trim(),
          content: match[2].replace(/\n$/, ""),
        });
        lastIndex = match.index + match[0].length;
      }
      if (lastIndex < text.length) {
        parts.push({ type: "text", content: text.slice(lastIndex) });
      }
      if (parts.length === 0) {
        parts.push({ type: "text", content: text });
      }
      return parts;
    }

    function fillBubble(bubble, text) {
      for (const part of parseMessage(text)) {
        if (part.type === "text") {
          if (part.content.length === 0) continue;
          const block = document.createElement("div");
          block.className = "markdown";
          block.innerHTML = renderMarkdown(part.content);
          block.querySelectorAll("a[href]").forEach((a) => {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          });
          bubble.appendChild(block);
        } else {
          if (part.lang) {
            const label = document.createElement("div");
            label.className = "code-lang";
            label.textContent = part.lang;
            bubble.appendChild(label);
          }
          const pre = document.createElement("pre");
          pre.className = "code-block";
          const code = document.createElement("code");
          code.textContent = part.content;
          const prismLang = prismLanguage(part.lang);
          if (prismLang) {
            code.className = "language-" + prismLang;
          }
          pre.appendChild(code);
          bubble.appendChild(pre);
        }
      }
    }

    function highlightCode(bubble) {
      if (!window.Prism) return;
      bubble.querySelectorAll("code.language-python, code.language-javascript").forEach(
        (block) => Prism.highlightElement(block)
      );
    }

    function addBubble(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : "bot");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      fillBubble(bubble, text);
      highlightCode(bubble);
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = !msg;
    }

    function clearChat() {
      history.splice(1);
      messagesEl.replaceChildren();
      showError("");
      input.focus();
    }

    clearBtn.addEventListener("click", clearChat);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      sendBtn.disabled = true;
      clearBtn.disabled = true;
      showError("");

      history.push({ role: "user", content: text });
      addBubble("user", text);

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: history,
            model: modelSelect.value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          const detail = data.detail
            ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail))
            : data.detail;
          throw new Error(
            [data.error, detail].filter(Boolean).join(" — ") || "Request failed"
          );
        }

        history.push({ role: "assistant", content: data.reply });
        addBubble("bot", data.reply);
      } catch (err) {
        showError(err.message);
        history.pop();
      } finally {
        sendBtn.disabled = false;
        clearBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
